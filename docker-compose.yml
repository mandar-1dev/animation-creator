services:
  backend:
    build: ./backend
    ports:
      - "8123:8123"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8123/api
    depends_on:
      - backend
